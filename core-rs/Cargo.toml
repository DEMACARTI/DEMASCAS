# DEMASCAS core in Rust — the real-time path (ears, voice, brain).
# Python stays as the tool server behind its HTTP endpoints.
[workspace]
resolver = "2"
members = ["crates/bridge", "crates/llm", "crates/brain", "crates/audio", "crates/sherpa", "crates/speech", "crates/events", "crates/voice", "crates/demascasd"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wiremock = "0.6"
cpal = "0.18"
bindgen = "0.73"
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
lto = "thin"
codegen-units = 4
