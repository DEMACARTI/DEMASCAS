# The app session of 18 Nov evening — easy things that caused friction
- {id: n18b-apps-count, cat: live-log-2, say: "how many apps are open right now?", expect: {tools: [list_running_applications], no_action: true, forbid: [search_web, web_search, smart_search], max_s: 1.5}}
